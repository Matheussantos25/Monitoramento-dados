<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e3edf7}*{box-sizing:border-box}body{margin:0;background:transparent;font-size:14px}details{border:1px solid #30455f;border-radius:14px;background:#101d2e;overflow:hidden}summary{cursor:pointer;padding:16px;color:#8cdeff;font-weight:650;min-height:52px}summary:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b3a1ff;outline-offset:-3px}.content{padding:0 16px 16px}.layout{display:grid;grid-template-columns:minmax(220px,1fr) 1fr;gap:20px}.figure{background:#0b1422;border-radius:12px;padding:12px;text-align:center}.view{color:#b3c6da;font-size:12px;margin-bottom:8px}svg{display:block;width:100%;max-width:310px;margin:auto}.pose{transition:opacity .22s ease}.pose[hidden]{display:none}h3{margin:0 0 12px;font-size:17px}.step{min-height:38px;margin-top:8px;color:#d5e3f2;font-weight:600}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{background:#1c334b;color:#e5f6ff;border:1px solid #496782;border-radius:8px;min-height:40px;padding:8px 14px;cursor:pointer;font:inherit}button[aria-pressed=true]{border-color:#87ddff;background:#23506a}button:disabled{opacity:.55;cursor:default}.play{margin:10px auto 0;display:block;width:100%;max-width:310px}ul{padding-left:20px;line-height:1.6;margin:0 0 14px}li+li{margin-top:8px}.avoid{color:#decda4;line-height:1.5;margin:12px 0}.notice{font-size:12px;color:#afc0d2;line-height:1.5;margin:12px 0 0}a{color:#93ddff;display:inline-block;padding-top:8px}.grip{border-left:3px solid #a99bff;padding:12px;background:#17253b;border-radius:4px 10px 10px 4px;margin-bottom:16px}.grip strong{font-size:13px;color:#d5caff}.grip p{font-size:12px;margin:2px 0;text-align:center;color:#c5d2e3}[hidden]{display:none!important}@media(max-width:520px){.layout{grid-template-columns:1fr;gap:14px}.content{padding:0 12px 14px}.figure svg{max-width:260px}summary{padding:14px}}@media(prefers-reduced-motion:reduce){.pose{transition:none}}
</style></head><body>
<details id="panel"><summary id="summary">Ver técnica e pegada</summary><div class="content">
<div class="grip" id="grip" hidden><strong id="gripTitle"></strong><svg id="hands" viewBox="0 0 300 102" role="img"></svg><p id="gripCaption"></p><p>Vista de quem executa · detalhe esquemático</p></div>
<div class="layout" id="layout"><div class="figure" id="figure"><div class="view" id="view"></div><svg id="drawing" viewBox="0 0 300 230" role="img"></svg><div class="step" id="step" aria-live="polite"></div><div class="buttons" id="steps"><button id="first" type="button">Início</button><button id="second" type="button">Final</button></div><button type="button" class="play" id="play">Reproduzir · 6 segundos</button><p class="notice" id="motionNote">Duas posições ilustrativas, não um vídeo de execução.</p></div>
<div><h3 id="title"></h3><ul id="cues"></ul><p class="avoid" id="avoid"></p><a id="source" target="_blank" rel="noopener noreferrer">Referência de técnica ↗</a><p class="notice" id="notice"></p></div></div>
</div></details>
<script>
"use strict";
const $=id=>document.getElementById(id),ns="http://www.w3.org/2000/svg";
let data=null,frame=0,timer=null,ticks=0,playing=false;
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},"*")}
function height(){send("streamlit:setFrameHeight",{height:Math.ceil(document.body.getBoundingClientRect().height)+2})}
function node(tag,attrs,container){const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);container.appendChild(n);return n}
function line(points,color,width,container){node("polyline",{points:points.map(p=>p.join(",")).join(" "),fill:"none",stroke:color,"stroke-width":width,"stroke-linecap":"round","stroke-linejoin":"round"},container)}
function draw(){const svg=$("drawing");svg.replaceChildren();if(!data?.motion)return;svg.setAttribute("aria-label",`${data.exercise}: ${data.guide.labels[frame]||data.guide.view}`);
line([[25,218],[275,218]],"#29415b",1,svg);
for(const l of data.motion.equipment||[])line(l,"#607a95",4,svg);
for(const c of data.motion.circles||[])node("circle",{cx:c[0],cy:c[1],r:c[2],fill:"none",stroke:"#607a95","stroke-width":3},svg);
data.motion.frames.forEach((p,i)=>{const g=node("g",{class:"pose",opacity:i===frame?1:0},svg);p.lines.forEach((l,j)=>line(l,j%2?"#88d7f3":"#d3edff",7,g));node("circle",{cx:p.head[0],cy:p.head[1],r:p.head[2],fill:"#d3edff"},g)});
$("step").textContent=data.guide.labels[frame]||"Postura ilustrativa";$("first").setAttribute("aria-pressed",String(frame===0));$("second").setAttribute("aria-pressed",String(frame===1));}
function select(index){frame=index;const groups=$("drawing").querySelectorAll(".pose");groups.forEach((g,i)=>g.setAttribute("opacity",i===index?1:0));$("drawing").setAttribute("aria-label",`${data.exercise}: ${data.guide.labels[frame]||data.guide.view}`);$("step").textContent=data.guide.labels[frame]||"Postura ilustrativa";$("first").setAttribute("aria-pressed",String(index===0));$("second").setAttribute("aria-pressed",String(index===1))}
function stop(){if(timer!==null)clearInterval(timer);timer=null;playing=false;$("play").textContent=reduced.matches?"Animação reduzida · use Início / Final":"Reproduzir · 6 segundos";$("play").disabled=reduced.matches}
function start(){if(!data?.motion||data.motion.frames.length<2||reduced.matches||!$("panel").open)return;if(playing){stop();return}playing=true;ticks=0;select(0);$("play").textContent="Parar animação";timer=setInterval(()=>{ticks++;select(ticks%2);if(ticks>=4){stop();select(0)}},1500)}
function render(args){const changed=data?.exercise!==args.exercise;if(changed){stop();frame=0;$("panel").open=false}data=args;$("summary").textContent=`Ver técnica e pegada · ${data.exercise}`;$("title").textContent=data.exercise;$("view").textContent=data.guide.view;$("notice").textContent=data.notice;$("avoid").textContent=data.guide.avoid;$("cues").replaceChildren();for(const cue of data.guide.cues){const li=document.createElement("li");li.textContent=cue;$("cues").appendChild(li)}
$("source").hidden=!data.guide.source;if(data.guide.source)$("source").href=data.guide.source;$("figure").hidden=!data.motion;$("layout").style.gridTemplateColumns=data.motion?"":"1fr";
const animated=Boolean(data.motion&&data.motion.frames.length>1);$("steps").hidden=!animated;$("play").hidden=!animated;$("motionNote").hidden=!animated;
$("grip").hidden=!data.grip;if(data.grip){$("gripTitle").textContent=data.grip.title;$("gripCaption").textContent=data.grip.caption;$("hands").setAttribute("aria-label",data.grip.title+". "+data.grip.caption);$("hands").replaceChildren();line([[35,35],[265,35]],"#607a95",9,$("hands"));for(const l of data.grip.lines)line(l,"#d3c6ff",4,$("hands"));for(const l of data.grip.marks)line(l,"#91e0ff",2,$("hands"))}
draw();if(!playing)stop();height()}
$("first").onclick=()=>{stop();select(0)};$("second").onclick=()=>{stop();select(1)};$("play").onclick=start;$("panel").addEventListener("toggle",()=>{if(!$("panel").open)stop();height()});document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});reduced.addEventListener("change",stop);new IntersectionObserver(entries=>{if(!entries[0].isIntersecting)stop()}).observe($("panel"));new ResizeObserver(height).observe(document.body);
window.addEventListener("message",event=>{if(event.source===parent&&event.data?.type==="streamlit:render")render(event.data.args)});send("streamlit:componentReady",{apiVersion:1});height();
</script></body></html>
