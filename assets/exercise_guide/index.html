<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guia de movimento · Solem</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e3edf7}*{box-sizing:border-box}body{margin:0;background:transparent;font-size:14px}details{border:1px solid #30455f;border-radius:14px;background:#101d2e;overflow:hidden}summary{cursor:pointer;padding:16px;color:#8cdeff;font-weight:650;min-height:52px}summary:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9edfff;outline-offset:3px}.content{padding:0 18px 18px}.layout{display:grid;grid-template-columns:minmax(250px,1.1fr) minmax(220px,1fr);gap:24px}.figure{background:radial-gradient(ellipse at 50% 45%,#1c3045,#0b1422 72%);border-radius:12px;padding:14px;text-align:center}.view{color:#b3c6da;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.scene{position:relative}#drawing{display:block;width:100%;max-width:440px;margin:auto;aspect-ratio:1}h3{margin:0 0 12px;font-size:20px;letter-spacing:-.02em}.direction{font-size:13px;color:#cae9f5;line-height:1.5;margin:4px 0 12px}.step{min-height:24px;margin:10px 0 4px;color:#d5e3f2;font-weight:600;font-size:13px}.buttons{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{background:#1c334b;color:#e5f6ff;border:1px solid #496782;border-radius:8px;min-height:44px;padding:8px 14px;cursor:pointer;font:inherit;transition:background .15s,transform .15s}button:hover{background:#294862}button:active{transform:translateY(1px)}button[aria-pressed=true]{border-color:#87ddff;background:#23506a}button:disabled{opacity:.55;cursor:default}.play{margin:12px auto 0;display:block;width:100%;max-width:380px;background:#214c65}.timeline{display:block;margin:12px auto 0;max-width:380px}input[type=range]{width:100%;accent-color:#8bdfff;min-height:32px;cursor:ew-resize}.timeline span{font-size:12px;color:#a9bccf}ul{padding-left:20px;line-height:1.65;margin:0 0 14px}li+li{margin-top:9px}.avoid{color:#decda4;line-height:1.6;margin:16px 0}.notice{font-size:12px;color:#afc0d2;line-height:1.55;margin:12px 0 0}a{color:#93ddff;display:inline-block;padding:10px 0}.grip{padding:14px 0 18px;margin-bottom:18px;border-bottom:1px solid #30455f}.grip strong{font-size:17px;color:#e4f4fc}.grip svg{display:block;width:100%;max-width:340px;margin:auto}.grip p{font-size:13px;margin:6px 0;color:#d3e5f3}.grip small{color:#a6bed0;font-size:12px}.landmarks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.landmarks span{border-left:2px solid #73cce9;padding:4px 10px;color:#b7d3e2;font-size:12px}[hidden]{display:none!important}.no-motion{grid-template-columns:1fr!important}@media(max-width:600px){.layout{grid-template-columns:1fr;gap:18px}.content{padding:0 12px 16px}.figure{padding:12px}summary{padding:14px}.grip{margin:0 0 16px}#drawing{max-width:360px}.grip svg{max-width:300px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body>
<details id="panel"><summary id="summary">Ver execução e pegada</summary><div class="content"><div class="layout" id="layout">
<div class="figure" id="figure"><div class="view" id="view"></div><div class="scene"><svg id="drawing" viewBox="0 0 440 440" role="img"></svg></div><p class="direction" id="direction"></p><div id="controls"><div class="buttons"><button id="first" type="button">Início</button><button id="middle" type="button">Meio</button><button id="last" type="button">Final</button></div><label class="timeline"><span>Explore o movimento</span><input id="position" aria-label="Posição do movimento" type="range" min="0" max="100" value="0" step="1"></label><div class="step" id="step"></div><button type="button" class="play" id="play">Reproduzir movimento · 8 s</button></div><p class="notice" id="motionNote">Movimento ilustrativo contínuo · 2 ciclos</p></div>
<div><div class="grip" id="grip" hidden><strong id="gripTitle"></strong><p id="gripInstruction"></p><svg id="hands" viewBox="0 0 360 165" role="img"></svg><p id="gripCaption"></p><small>Detalhe ampliado · como você vê suas mãos</small></div><h3 id="title"></h3><ul id="cues"></ul><div class="landmarks" id="landmarks"></div><p class="avoid" id="avoid"></p><a id="source" target="_blank" rel="noopener noreferrer">Referência de técnica ↗</a><p class="notice" id="notice"></p></div>
</div></div></details><script src="figure.js"></script><script src="guide.js"></script></body></html>
