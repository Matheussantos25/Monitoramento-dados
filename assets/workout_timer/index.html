<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;color:#e7f1ff;background:transparent}
.clocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.clock{background:#152336;border:1px solid #375174;border-radius:13px;padding:16px}
h3{font-size:15px;margin:0 0 10px}output{display:block;font-size:32px;font-weight:650;font-variant-numeric:tabular-nums;margin:10px 0}
.controls{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;border:1px solid #537193;border-radius:8px;padding:9px;color:#e7f1ff;background:#1c3047}
button{cursor:pointer;font-size:12px}button.primary{background:#83dcff;color:#0b1928}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #83dcff;outline-offset:2px}
label,p{font-size:12px;color:#b7c8df}input{width:78px}p{margin-bottom:0;line-height:1.45}#done{color:#83dcff;min-height:18px}
@media(max-width:540px){.clocks{grid-template-columns:1fr}output{font-size:28px}}
</style></head><body><div class="clocks">
<section class="clock"><h3>Cronômetro da atividade</h3><output id="stopwatch" aria-label="Tempo medido">00:00:00</output>
<div class="controls"><button class="primary" id="start-watch">Iniciar</button><button id="reset-watch">Zerar</button><button id="apply-watch" hidden>Usar tempo no registro</button></div><p id="watch-hint">Meça suas séries. O relógio não salva o treino automaticamente.</p></section>
<section class="clock"><h3>Temporizador / descanso</h3><label for="seconds">Contagem regressiva (segundos)</label> <input id="seconds" type="number" min="0" max="86400" step="1" value="60">
<output id="countdown" aria-label="Tempo restante">00:01:00</output><div class="controls"><button class="primary" id="start-count">Iniciar</button><button id="reset-count">Reiniciar</button></div><p id="rest-hint"></p><p id="done" role="status" aria-live="polite"></p></section></div>
<script src="clock.js"></script><script>
'use strict';
const el=id=>document.getElementById(id), watch=new WorkoutClock(), countdown=new WorkoutClock();
let total=60, storageKey=null, lastRest=null, complete=false, audio=null;
function send(type,data){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');}
function publish(value){send('streamlit:setComponentValue',{dataType:'json',value:{id:crypto.randomUUID(),...value}});}
function format(ms){const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');}
function persist(){if(storageKey)try{sessionStorage.setItem(storageKey,JSON.stringify({watch,countdown,total,lastRest,complete}));}catch(_){}}
function initAudio(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();}catch(_){}}
function beep(){try{if(!audio)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.frequency.value=880;gain.gain.setValueAtTime(.12,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.5);osc.start();osc.stop(audio.currentTime+.5);}catch(_){}}
function paint(){const now=Date.now();if(countdown.started!==null&&countdown.remaining(total,now)===0){countdown.pause(now);countdown.elapsed=total*1000;complete=true;beep();persist();}
el('stopwatch').textContent=format(watch.used(now));el('countdown').textContent=format(Math.ceil(countdown.remaining(total,now)/1000)*1000);
el('start-watch').textContent=watch.started===null?'Iniciar':'Pausar';el('start-count').textContent=countdown.started===null?'Iniciar':'Pausar';
el('apply-watch').disabled=watch.started!==null||watch.used(now)<1000;el('start-count').disabled=complete||total<=0;el('seconds').disabled=countdown.started!==null;
el('done').textContent=complete?'Tempo concluído! Registre sua série.':'';}
el('start-watch').onclick=()=>{watch.started===null?watch.start(Date.now()):watch.pause(Date.now());persist();paint();};
el('reset-watch').onclick=()=>{watch.reset();persist();paint();};
el('apply-watch').onclick=()=>publish({event:'use_time',duration_seconds:Math.floor(watch.used(Date.now())/1000)});
el('start-count').onclick=()=>{initAudio();countdown.started===null?countdown.start(Date.now()):countdown.pause(Date.now());persist();paint();};
el('reset-count').onclick=()=>{countdown.reset();complete=false;persist();paint();};
el('seconds').onchange=()=>{total=Math.min(86400,Math.max(0,Math.floor(Number(el('seconds').value)||0)));el('seconds').value=total;countdown.reset();complete=false;lastRest=total;persist();publish({event:'configure',seconds:total});paint();};
window.addEventListener('message',e=>{if(e.data?.type!=='streamlit:render')return;const args=e.data.args||{};
if(!storageKey){storageKey='solem_workout_clock_'+args.exercise;try{const saved=JSON.parse(sessionStorage.getItem(storageKey));if(saved){Object.assign(watch,saved.watch);Object.assign(countdown,saved.countdown);total=saved.total;lastRest=saved.lastRest;complete=saved.complete;}}catch(_){}}
if(args.has_rest&&lastRest!==args.rest_seconds){lastRest=args.rest_seconds;total=Math.max(0,Number(lastRest)||0);countdown.reset();complete=false;}
el('seconds').value=total;el('apply-watch').hidden=!args.can_apply;el('rest-hint').textContent=args.has_rest?'Vinculado ao campo Descanso entre séries. Alterar o tempo reinicia a contagem.':'Ajuste o tempo de sua atividade. O cronômetro e este temporizador são independentes.';
el('watch-hint').textContent=args.can_apply?'Pause antes de transferir o tempo. Não salva o treino automaticamente.':'Use para medir suas séries; registre as repetições no formulário.';
paint();persist();send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight});});
new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight})).observe(document.body);
setInterval(paint,200);document.addEventListener('visibilitychange',paint);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
