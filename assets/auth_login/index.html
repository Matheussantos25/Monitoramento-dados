<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#eef6ff;font:15px/1.5 system-ui,sans-serif}main{max-width:420px;margin:auto;padding:8px 4px 20px}h1{font-size:27px;line-height:1.2;margin:8px 0 10px;letter-spacing:-.04em}p{color:#b2c4d9;margin:0 0 20px}.mark{color:#83dcff;font-size:26px}form{padding:24px;border:1px solid #30435f;border-radius:14px;background:#101b2b}label{display:block;margin-bottom:7px}input[type=email],input[type=password]{width:100%;padding:13px 14px;background:#1b2940;color:#eef6ff;border:1px solid #415570;border-radius:8px;font:inherit;margin-bottom:18px}input:focus-visible,button:focus-visible{outline:3px solid #83dcff;outline-offset:2px}.remember{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}.remember input{accent-color:#83dcff;width:18px;height:18px;flex-shrink:0;margin-top:3px}small{display:block;color:#aabbce;font-size:12px;margin-bottom:18px}button{min-height:44px;border:1px solid #4b607b;border-radius:8px;background:transparent;color:#eef6ff;font:inherit;padding:9px 14px;cursor:pointer}button[type=submit]{width:100%;background:#83dcff;color:#0b1828;font-weight:650;border:0}button:disabled{opacity:.55;cursor:wait}.secondary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}.secondary button{font-size:13px;padding:7px 10px}.message{border-radius:8px;margin:12px 0 0;font-size:13px;padding:12px;color:#d1e7f9;background:#162c44}.message.error{color:#ffd8d8;background:#38202c}[hidden]{display:none!important}.news{font-size:12px;margin:16px 0 0}.status{text-align:center;color:#b2c4d9;padding:12px}
</style></head><body>
<main id="main"><div id="status" class="status" role="status">Verificando seu acesso…</div>
<section id="login" hidden><div class="mark" aria-hidden="true">✳</div><h1>Seu espaço começa aqui.</h1><p>Entre uma vez. Continue sua jornada neste computador.</p>
<form id="form"><label for="email">E-mail</label><input id="email" name="username" type="email" autocomplete="username" inputmode="email" maxlength="254" required>
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
<label class="remember"><input id="remember" type="checkbox"><span>Lembrar e-mail e manter conectado neste computador</span></label>
<small>Use apenas no seu PC. O Solem não guarda sua senha; o acesso salvo pode ser usado por quem tiver acesso a este perfil do navegador.</small>
<button id="submit" type="submit">Entrar</button><div id="message" class="message" role="status" aria-live="polite" hidden></div></form>
<div class="secondary"><button id="mode" type="button">Criar uma conta</button><button id="forget" type="button">Esquecer este computador</button></div>
<p class="news">Metas personalizáveis e estúdio de criação de vídeos.</p></section></main>
<script src="login.bundle.js"></script></body></html>
