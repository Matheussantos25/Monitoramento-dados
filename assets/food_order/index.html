<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{font:14px system-ui,sans-serif;color-scheme:dark;color:#eef6ff}*{box-sizing:border-box}body{margin:0;background:transparent}
#list{display:grid;gap:6px;max-height:310px;overflow:auto;padding:3px 5px 3px 3px;overscroll-behavior:contain}
.row{display:flex;align-items:center;gap:10px;min-height:54px;padding:4px 8px;border:1px solid #344b60;border-radius:10px;background:#112235}
.row.target{border:2px solid #83dcff;background:#203c51}.row.dragging{opacity:.5}.label{flex:1;overflow-wrap:anywhere}.number{color:#83dcff;font-variant-numeric:tabular-nums}
button{font:inherit;background:transparent;color:inherit;border:0;border-radius:7px;min-width:44px;min-height:44px;cursor:pointer}button:hover{background:#294458}button:disabled{opacity:.25;cursor:default}button:focus-visible{outline:2px solid #83dcff;outline-offset:-2px}.handle{touch-action:none;cursor:grab;font-size:23px;letter-spacing:-5px;padding-right:12px}.handle:active{cursor:grabbing}
#status{font-size:12px;color:#b6cbdc;min-height:20px;margin:7px 4px 0}.ghost{position:fixed;z-index:5;pointer-events:none;box-shadow:0 6px 20px #0006;border-color:#83dcff;opacity:.96}
</style></head><body>
<div id="list" role="list" aria-label="Ordem dos alimentos"></div><div id="status" role="status" aria-live="polite">Arraste para mudar a posição.</div>
<script src="order.js"></script></body></html>
