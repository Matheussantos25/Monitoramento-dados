<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; color: #dce9f9; background: transparent; }
    .box { padding: 14px 16px; border: 1px solid #375174; border-radius: 13px; background: #152336; }
    .title { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
    .description, .status { margin: 0 0 10px; color: #a9bdd5; font-size: 12px; line-height: 1.45; }
    .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    button { padding: 9px 13px; border: 1px solid #78ceff; border-radius: 9px; color: #0b1928; background: #83dcff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    output { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .status { margin: 10px 0 0; min-height: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <p class="title">Distância por GPS (opcional)</p>
    <p class="description">Para caminhada ou corrida. Funciona enquanto esta página estiver aberta e visível. Só a distância final será usada; trajeto e coordenadas não são salvos.</p>
    <div class="controls"><button id="toggle" type="button">Iniciar GPS</button><output id="distance">0,000 km</output></div>
    <p class="status" id="status" role="status">Você também pode digitar a distância manualmente.</p>
  </div>
  <script>
    "use strict";
    const button = document.getElementById("toggle");
    const display = document.getElementById("distance");
    const status = document.getElementById("status");
    let watchId = null;
    let previous = null;
    let meters = 0;
    let serial = 0;

    function send(type, data) {
      window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
    }
    function frameHeight() {
      send("streamlit:setFrameHeight", {height: document.documentElement.scrollHeight});
    }
    function showDistance() {
      display.textContent = (meters / 1000).toFixed(3).replace(".", ",") + " km";
    }
    function haversine(a, b) {
      const rad = Math.PI / 180;
      const latitude = (b.latitude - a.latitude) * rad;
      const longitude = (b.longitude - a.longitude) * rad;
      const arc = Math.sin(latitude / 2) ** 2 +
        Math.cos(a.latitude * rad) * Math.cos(b.latitude * rad) * Math.sin(longitude / 2) ** 2;
      return 6371000 * 2 * Math.atan2(Math.sqrt(arc), Math.sqrt(1 - arc));
    }
    function stop(publish, message) {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      previous = null;
      button.textContent = "Iniciar GPS";
      status.textContent = message || "Medição interrompida. Você pode ajustar o campo de distância.";
      if (publish) {
        serial += 1;
        send("streamlit:setComponentValue", {dataType: "json", value: {
          event: "finished", id: Date.now() + "-" + serial, km: Number((meters / 1000).toFixed(3))
        }});
      }
    }
    function onPosition(position) {
      if (watchId === null) return;
      const point = position.coords;
      if (!Number.isFinite(point.accuracy) || point.accuracy > 50) {
        status.textContent = "Aguardando sinal GPS mais preciso (até 50 m)…";
        return;
      }
      if (previous) {
        const step = haversine(previous.coords, point);
        const elapsed = (position.timestamp - previous.timestamp) / 1000;
        if (step >= 2 && step <= 250 && elapsed > 0 && step / elapsed <= 8) {
          meters += step;
          showDistance();
        }
      }
      previous = {coords: {latitude: point.latitude, longitude: point.longitude}, timestamp: position.timestamp};
      status.textContent = "Medição ativa. Toque em Parar GPS antes de salvar o treino.";
    }
    function onError(error) {
      const reason = error.code === 1 ? "Permissão de localização negada." :
        error.code === 2 ? "Localização indisponível neste aparelho." : "Tempo esgotado ao obter GPS.";
      stop(false, reason + " Informe a distância manualmente, se preferir.");
    }
    button.addEventListener("click", () => {
      if (watchId !== null) { stop(true, "Distância transferida para o formulário. Confira e salve o treino."); return; }
      if (!window.isSecureContext || !navigator.geolocation) {
        status.textContent = "GPS indisponível: abra o site por HTTPS ou informe a distância manualmente.";
        return;
      }
      meters = 0;
      previous = null;
      showDistance();
      status.textContent = "Solicitando localização…";
      button.textContent = "Parar GPS";
      try {
        watchId = navigator.geolocation.watchPosition(onPosition, onError,
          {enableHighAccuracy: true, maximumAge: 0, timeout: 20000});
      } catch (_) {
        stop(false, "Não foi possível iniciar o GPS. Informe a distância manualmente.");
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && watchId !== null) stop(true, "Medição pausada ao sair desta página.");
    });
    window.addEventListener("pagehide", () => { if (watchId !== null) stop(false); });
    window.addEventListener("message", event => {
      if (event.data && event.data.type === "streamlit:render") frameHeight();
    });
    send("streamlit:componentReady", {apiVersion: 1});
    frameHeight();
  </script>
</body>
</html>
